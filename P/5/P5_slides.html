# Project

## Group project

__Part B__

- Write the code to:
    + Read it into R
    + Reshape the data if necessary into long format
    + Check the variable classes and update them if necessary
- Explore your data using `ggplot2` graphics
    + Represent the __distribution of the variables__: pick one continuous variable and one discrete variable and use histograms or bar graphs to show their distribution
    + __Summarize the data__: use one geom to summarize data (e.g.: `geom_smooth`, boxplots, ...) of two variables
- Explain your data with graphics and text
    + Choose the __three graphics__ that better describe your data
    + __Customize__ and __annotate__ them
    + Accompany the figures with your __hypothesis__ and/or __interpretation__

# Project

## Group project

__Part C__

- Make your figures interactive in three different ways (one for each figure):
    + Make an interactive visualization using some `htmlwidget`
    + Add __interactive controls__ with `shiny` input widgets to show some useful information (eg. focus on a subset, add a summary layer...)
    + Make an __interactive visualization__ using `shiny` built-in interactive options in order to print the information of the individual observations
- Decide which figure would benefit from each type of interactivity and justify your choice
